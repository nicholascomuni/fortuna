name: Deploy backend to App Runner

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build and push image
        env:
          REPOSITORY: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          docker build -t "$REPOSITORY:latest" -t "$REPOSITORY:${{ github.sha }}" backend
          docker push "$REPOSITORY:latest"
          docker push "$REPOSITORY:${{ github.sha }}"

      # App Runner has auto_deployments_enabled = true, so the push above
      # already triggers the rollout on its own. Calling
      # `aws apprunner start-deployment` here too used to race against that
      # auto-trigger and fail with "isn't in RUNNING state" even though the
      # deploy had already started — so we don't call it.
