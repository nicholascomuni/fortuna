name: Deploy backend to App Runner

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build and push image
        env:
          REPOSITORY: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          docker build -t "$REPOSITORY:latest" -t "$REPOSITORY:${{ github.sha }}" backend
          docker push "$REPOSITORY:latest"
          docker push "$REPOSITORY:${{ github.sha }}"

      # ECR push already triggers App Runner's auto-deployment, but this
      # makes the rollout start immediately instead of waiting on the event.
      - name: Trigger App Runner deployment
        if: vars.APPRUNNER_SERVICE_ARN != ''
        run: |
          aws apprunner start-deployment --service-arn "${{ vars.APPRUNNER_SERVICE_ARN }}"
